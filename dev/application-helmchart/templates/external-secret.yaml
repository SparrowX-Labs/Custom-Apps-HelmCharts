{{- if .Values.database.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "application-helmchart.databaseSecretName" . | quote }}
  labels:
    {{- include "application-helmchart.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- include "application-helmchart.annotations" $ | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.database.secretStore.name | quote }}
    kind: {{ .Values.database.secretStore.kind | quote }}
  target:
    name: {{ include "application-helmchart.databaseSecretName" . | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        DB_USERNAME: '{{`{{- range $key, $value := . }}{{- $json := $value | fromJson }}{{ $json.username }}{{- end }}`}}'
        DB_PASSWORD: '{{`{{- range $key, $value := . }}{{- $json := $value | fromJson }}{{ $json.password }}{{- end }}`}}'
  dataFrom:
    - find:
        tags:
          {{- include "application-helmchart.databaseTags" . | nindent 10 }}
{{- end }}
