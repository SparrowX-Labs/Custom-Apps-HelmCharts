{{- if .Values.database.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "application-helmchart.databaseSecretName" . | quote }}
  labels:
    {{- include "application-helmchart.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.database.secretStore.name | quote }}
    kind: {{ .Values.database.secretStore.kind | quote }}
  target:
    name: {{ include "application-helmchart.databaseSecretName" . | quote }}
    creationPolicy: Owner
  dataFrom:
    - find:
        tags:
          Name: {{ include "application-helmchart.databaseTagName" . | quote }}
          Project: {{ .Values.projectName | quote }}
          Environment: {{ .Values.environment | quote }}
          "aws:secretsmanager:owningService": rds
{{- end }}
