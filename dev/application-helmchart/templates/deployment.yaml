apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application-helmchart.fullname" . }}
  labels:
    {{- include "application-helmchart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "application-helmchart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application-helmchart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "application-helmchart.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.container.name }}
          image: {{ if .Values.image.tag }}{{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) .Values.image.tag | quote }}{{ else }}{{ required "image.repository is required" .Values.image.repository | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: {{ .Values.container.protocol }}
          {{- with .Values.container.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.container.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.database.enabled .Values.container.env }}
          env:
            {{- if .Values.database.enabled }}
            - name: DB_ENGINE
              value: {{ .Values.database.engine | quote }}
            - name: DB_HOST
              value: {{ required "database.host is required when database.enabled is true" .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            {{- end }}
            {{- with .Values.container.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.database.enabled .Values.container.envFrom }}
          envFrom:
            {{- if .Values.database.enabled }}
            - secretRef:
                name: {{ include "application-helmchart.databaseSecretName" . }}
            {{- end }}
            {{- with .Values.container.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
