{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host }}
{{- $backendName := default (include "application-helmchart.fullname" .) .Values.ingress.name }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "application-helmchart.fullname" . }}
  labels:
    {{- include "application-helmchart.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.extraAnnotations }}
  annotations:
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.extraAnnotations }}
    {{- include "application-helmchart.annotations" $ | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $host }}
  tls:
    - hosts:
        - {{ $host | quote }}
  {{- else if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  {{- if $host }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: 80
  {{- else }}
  rules:
    {{- toYaml .Values.ingress.hosts | nindent 4 }}
  {{- end }}
{{- end }}
