{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "application-helmchart.serviceAccountName" . }}
  labels:
    {{- include "application-helmchart.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.extraAnnotations }}
  annotations:
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.extraAnnotations }}
    {{- include "application-helmchart.annotations" $ | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
