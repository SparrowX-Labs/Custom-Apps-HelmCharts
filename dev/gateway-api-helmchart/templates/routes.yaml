{{- $listener := index .Values.gateway.listeners 0 }}
{{- range $apiKey, $api := .Values.apis }}
{{- $namespace := default $.Values.gateway.namespace $api.namespace }}
{{- $hostname := default $listener.hostname $api.hostname }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required (printf "apis.%s.routeName is required" $apiKey) $api.routeName }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hostnames:
    - {{ $hostname }}
  parentRefs:
    - name: {{ default $.Values.gateway.name $api.gatewayName }}
      namespace: {{ default $.Values.gateway.namespace $api.gatewayNamespace }}
      sectionName: {{ default $listener.name $api.sectionName }}
  rules:
    - matches:
        - path:
            type: {{ default "PathPrefix" $api.pathType }}
            value: {{ required (printf "apis.%s.path is required" $apiKey) $api.path }}
      {{- with $api.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ required (printf "apis.%s.backendService is required" $apiKey) $api.backendService }}
          port: {{ required (printf "apis.%s.servicePort is required" $apiKey) $api.servicePort }}
{{- end }}
