gatewayClass:
  name: traefik
  controllerName: traefik.io/gateway-controller
  labels:
    sparrowx.io/traefik-instance: dev

gateway:
  name: public-gateway-dev
  namespace: dev
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: sparrowx.dev.mo2cloud.com
      allowedRoutes:
        namespaces:
          from: Same

apis: {}
