{{- range $apiKey, $api := .Values.apis }}
{{- if and $api.referenceGrant $api.referenceGrant.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: {{ default (printf "%s-backend" $apiKey) $api.referenceGrant.name }}
  namespace: {{ default $.Values.gateway.namespace $api.referenceGrant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    {{- toYaml $api.referenceGrant.from | nindent 4 }}
  to:
    {{- toYaml $api.referenceGrant.to | nindent 4 }}
{{- end }}
{{- end }}
